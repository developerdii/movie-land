<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The .ico and the PNGs come first: Safari does not use SVG favicons. The SVG is for the browsers that can use it.
         The apple-touch icon is opaque, because iOS fills any transparent pixel. -->
    <link rel="icon" href="./img/icons/movieland-favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="./img/icons/movieland-favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./img/icons/movieland-favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="./movieland-favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="./img/icons/movieland-apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Movie Land</title>
    <script>
      // Apply the saved dark mode choice before first paint (key: movieland-theme, see src/utils/theme.js).
      try {
        if (localStorage.getItem('movieland-theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {
        // Storage blocked: keep the light theme.
      }
    </script>
  </head>
  <body>
    <noscript>
      <strong>Movie Land doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
